name: Build Wild Sync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: mac-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: mac-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Write service account credentials
        shell: bash
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > src-tauri/resources/wild-sync-service-account.json

      - name: Download rclone (Mac ARM)
        if: matrix.name == 'mac-arm'
        run: |
          curl -L https://downloads.rclone.org/rclone-current-osx-arm64.zip -o rclone.zip
          unzip rclone.zip
          mv rclone-*/rclone src-tauri/binaries/rclone-aarch64-apple-darwin
          chmod +x src-tauri/binaries/rclone-aarch64-apple-darwin

      - name: Download rclone (Mac Intel)
        if: matrix.name == 'mac-intel'
        run: |
          curl -L https://downloads.rclone.org/rclone-current-osx-amd64.zip -o rclone.zip
          unzip rclone.zip
          mv rclone-*/rclone src-tauri/binaries/rclone-x86_64-apple-darwin
          chmod +x src-tauri/binaries/rclone-x86_64-apple-darwin

      - name: Download rclone (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "rclone-tmp"
          Move-Item "rclone-tmp\rclone-*\rclone.exe" "src-tauri\binaries\rclone-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          CI: true

      - name: Add ReadMe to DMG (Mac)
        if: startsWith(matrix.platform, 'macos')
        run: |
          DMG=$(find src-tauri/target -name "*.dmg" | head -1)
          echo "Found DMG: $DMG"

          # Create ReadMe.txt
          printf 'Mac Install Instructions\n=========================\n\nIf macOS says "Wild Sync.app is damaged", run this in Terminal:\n\n    xattr -cr "/Applications/Wild Sync.app"\n\nThen open Wild Sync normally.\n\nYou only need to do this once.\n\n---\n\nTo open Terminal:\n1. Press Cmd + Space\n2. Type "Terminal"\n3. Press Enter\n4. Paste the command above and press Enter\n' > /tmp/ReadMe.txt

          # Convert DMG to read-write
          RW_DMG="/tmp/wild-sync-rw.dmg"
          hdiutil convert "$DMG" -format UDRW -o "$RW_DMG"

          # Mount it
          MOUNT_INFO=$(hdiutil attach "$RW_DMG" -nobrowse)
          VOLUME=$(echo "$MOUNT_INFO" | grep "/Volumes/" | awk -F'\t' '{print $3}')

          # Copy ReadMe.txt in
          cp /tmp/ReadMe.txt "$VOLUME/ReadMe.txt"

          # Detach
          hdiutil detach "$VOLUME" -force

          # Convert back to compressed and replace
          hdiutil convert "$RW_DMG" -format UDZO -o "${DMG}.new"
          mv "${DMG}.new" "$DMG"
          rm -f "$RW_DMG"
          echo "ReadMe.txt added to DMG"

      - name: Upload artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # Create draft release if it doesn't exist
          gh release view "$TAG" --repo "$REPO" 2>/dev/null || \
            gh release create "$TAG" --repo "$REPO" --draft --title "Wild Sync $TAG" --notes "Build in progress..."

          # Upload artifacts
          if [[ "${{ matrix.platform }}" == macos* ]]; then
            DMG=$(find src-tauri/target -name "*.dmg" | head -1)
            [ -f "$DMG" ] && gh release upload "$TAG" "$DMG" --repo "$REPO" --clobber
            TARGZ=$(find src-tauri/target -name "*.app.tar.gz" | head -1)
            [ -f "$TARGZ" ] && gh release upload "$TAG" "$TARGZ" --repo "$REPO" --clobber
          else
            EXE=$(find src-tauri/target -name "*.exe" | head -1)
            [ -f "$EXE" ] && gh release upload "$TAG" "$EXE" --repo "$REPO" --clobber
            MSI=$(find src-tauri/target -name "*.msi" | head -1)
            [ -f "$MSI" ] && gh release upload "$TAG" "$MSI" --repo "$REPO" --clobber
            TARGZ=$(find src-tauri/target -name "*.app.tar.gz" | head -1)
            [ -f "$TARGZ" ] && gh release upload "$TAG" "$TARGZ" --repo "$REPO" --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
