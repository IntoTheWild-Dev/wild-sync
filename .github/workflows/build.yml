name: Build Wild Sync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write   # needed to create GitHub releases on tag push
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: mac-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: mac-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Write service account credentials
        shell: bash
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > src-tauri/resources/wild-sync-service-account.json

      - name: Download rclone (Mac ARM)
        if: matrix.name == 'mac-arm'
        run: |
          curl -L https://downloads.rclone.org/rclone-current-osx-arm64.zip -o rclone.zip
          unzip rclone.zip
          mv rclone-*/rclone src-tauri/binaries/rclone-aarch64-apple-darwin
          chmod +x src-tauri/binaries/rclone-aarch64-apple-darwin

      - name: Download rclone (Mac Intel)
        if: matrix.name == 'mac-intel'
        run: |
          curl -L https://downloads.rclone.org/rclone-current-osx-amd64.zip -o rclone.zip
          unzip rclone.zip
          mv rclone-*/rclone src-tauri/binaries/rclone-x86_64-apple-darwin
          chmod +x src-tauri/binaries/rclone-x86_64-apple-darwin

      - name: Download rclone (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "rclone-tmp"
          Move-Item "rclone-tmp\rclone-*\rclone.exe" "src-tauri\binaries\rclone-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          CI: true

      - name: Add ReadMe to DMG (Mac)
        if: startsWith(matrix.platform, 'macos')
        run: |
          # Find the built DMG
          DMG=$(find src-tauri/target -name "*.dmg" | head -1)
          echo "Found DMG: $DMG"

          # Create ReadMe.txt with install instructions
          cat > /tmp/ReadMe.txt << 'TXT'
  Mac Install Instructions
  =========================

  If macOS says "Wild Sync.app is damaged", run this in Terminal:

      xattr -cr "/Applications/Wild Sync.app"

  Then open Wild Sync normally.

  You only need to do this once.

  ---

  To open Terminal:
  1. Press Cmd + Space
  2. Type "Terminal"
  3. Press Enter
  4. Paste the command above and press Enter
  TXT

          # Mount the DMG read-write
          MOUNT_POINT="/tmp/wild-sync-dmg-mount"
          mkdir -p "$MOUNT_POINT"

          # Attach with write access
          DEVICE=$(hdiutil attach "$DMG" -nobrowse -readonly | grep "/Volumes/" | tail -1 | awk '{print $1}')
          VOLUME=$(hdiutil attach "$DMG" -nobrowse -readonly | grep "/Volumes/" | tail -1 | awk '{print $3}')

          # Actually, let's use a different approach: convert to read-write, mount, add file, convert back
          hdiutil detach "$VOLUME" -force 2>/dev/null || true

          RW_DMG="/tmp/wild-sync-rw.dmg"
          hdiutil convert "$DMG" -format UDRW -o "$RW_DMG"

          MOUNT_INFO=$(hdiutil attach "$RW_DMG" -nobrowse)
          VOLUME=$(echo "$MOUNT_INFO" | grep "/Volumes/" | awk '{print $3}')

          # Copy ReadMe.txt into the DMG volume
          cp /tmp/ReadMe.txt "$VOLUME/ReadMe.txt"

          # Detach
          hdiutil detach "$VOLUME" -force

          # Convert back to compressed DMG and replace original
          hdiutil convert "$RW_DMG" -format UDZO -o "${DMG}.new"
          mv "${DMG}.new" "$DMG"

          rm -f "$RW_DMG"
          echo "ReadMe.txt added to DMG"

      - name: Upload artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"

          # Create draft release if it doesn't exist
          gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null || \
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --draft \
              --title "Wild Sync $TAG" \
              --notes "Build in progress..."

          # Find and upload artifacts
          if [[ "${{ matrix.platform }}" == macos* ]]; then
            # Upload DMG
            DMG=$(find src-tauri/target -name "*.dmg" | head -1)
            if [ -f "$DMG" ]; then
              gh release upload "$TAG" "$DMG" --repo ${{ github.repository }} --clobber
            fi
            # Upload app.tar.gz if it exists
            TARGZ=$(find src-tauri/target -name "*.app.tar.gz" | head -1)
            if [ -f "$TARGZ" ]; then
              gh release upload "$TAG" "$TARGZ" --repo ${{ github.repository }} --clobber
            fi
          else
            # Windows: upload exe and msi
            EXE=$(find src-tauri/target -name "*.exe" | head -1)
            if [ -f "$EXE" ]; then
              gh release upload "$TAG" "$EXE" --repo ${{ github.repository }} --clobber
            fi
            MSI=$(find src-tauri/target -name "*.msi" | head -1)
            if [ -f "$MSI" ]; then
              gh release upload "$TAG" "$MSI" --repo ${{ github.repository }} --clobber
            fi
            # Upload app.tar.gz if it exists
            TARGZ=$(find src-tauri/target -name "*.app.tar.gz" | head -1)
            if [ -f "$TARGZ" ]; then
              gh release upload "$TAG" "$TARGZ" --repo ${{ github.repository }} --clobber
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
