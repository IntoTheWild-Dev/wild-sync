name: Build Wild Sync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: mac-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: mac-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Write service account credentials
        shell: bash
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > src-tauri/resources/wild-sync-service-account.json

      - name: Download rclone (Mac ARM)
        if: matrix.name == 'mac-arm'
        run: |
          curl -L https://downloads.rclone.org/rclone-current-osx-arm64.zip -o rclone.zip
          unzip rclone.zip
          mv rclone-*/rclone src-tauri/binaries/rclone-aarch64-apple-darwin
          chmod +x src-tauri/binaries/rclone-aarch64-apple-darwin

      - name: Download rclone (Mac Intel)
        if: matrix.name == 'mac-intel'
        run: |
          curl -L https://downloads.rclone.org/rclone-current-osx-amd64.zip -o rclone.zip
          unzip rclone.zip
          mv rclone-*/rclone src-tauri/binaries/rclone-x86_64-apple-darwin
          chmod +x src-tauri/binaries/rclone-x86_64-apple-darwin

      - name: Download rclone (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "rclone-tmp"
          Move-Item "rclone-tmp\rclone-*\rclone.exe" "src-tauri\binaries\rclone-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Wild Sync {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Wild Sync ${{ github.ref_name }}

            ---

            ### Mac — Apple Silicon (M1 / M2 / M3 / M4)
            Download **\`Wild.Sync_${{ github.ref_name }}_aarch64.dmg\`**

            ### Mac — Intel
            Download **\`Wild.Sync_${{ github.ref_name }}_x64.dmg\`**

            ### Windows
            Download **\`Wild.Sync_${{ github.ref_name }}_x64-setup.exe\`**

            ---

            ### Mac users — read this before opening the app

            Mac blocks apps not from the App Store. Do this once:

            1. Download the `.dmg` and drag Wild Sync to Applications
            2. Open **Terminal** (Cmd + Space, type "Terminal", press Enter)
            3. Paste this command and press Enter:

               ```
               xattr -cr "/Applications/Wild Sync.app"
               ```

            4. Open Wild Sync — it will launch normally every time after this

            Also download **\`ReadMe.txt\`** from the assets below for reference.
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: false
          args: --target ${{ matrix.target }}

  upload-readme:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create and upload ReadMe.txt
        run: |
          cat > ReadMe.txt << 'EOF'
          Mac Install Instructions
          ========================

          If macOS says "Wild Sync.app is damaged", run this in Terminal:

              xattr -cr "/Applications/Wild Sync.app"

          Then open Wild Sync normally.
          You only need to do this once.

          ---

          To open Terminal:
          1. Press Cmd + Space
          2. Type "Terminal"
          3. Press Enter
          4. Paste the command above and press Enter
          EOF
          gh release upload ${{ github.ref_name }} ReadMe.txt --repo ${{ github.repository }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}