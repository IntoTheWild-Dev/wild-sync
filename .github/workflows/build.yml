name: Build Wild Sync

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write   # needed to create GitHub releases on tag push
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: mac-arm
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: mac-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      # Write the service account JSON from GitHub secret before building.
      # Go to GitHub repo → Settings → Secrets → Actions and add:
      # Name: SERVICE_ACCOUNT_JSON
      # Value: paste the full contents of wild-sync-service-account.json
      - name: Write service account credentials
        shell: bash
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > src-tauri/resources/wild-sync-service-account.json

      # Download and place rclone binaries.
      # Update these URLs when a new rclone version is released.
      - name: Download rclone (Mac ARM)
        if: matrix.name == 'mac-arm'
        run: |
          curl -L https://downloads.rclone.org/rclone-current-osx-arm64.zip -o rclone.zip
          unzip rclone.zip
          mv rclone-*/rclone src-tauri/binaries/rclone-aarch64-apple-darwin
          chmod +x src-tauri/binaries/rclone-aarch64-apple-darwin

      - name: Download rclone (Mac Intel)
        if: matrix.name == 'mac-intel'
        run: |
          curl -L https://downloads.rclone.org/rclone-current-osx-amd64.zip -o rclone.zip
          unzip rclone.zip
          mv rclone-*/rclone src-tauri/binaries/rclone-x86_64-apple-darwin
          chmod +x src-tauri/binaries/rclone-x86_64-apple-darwin

      - name: Download rclone (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path "rclone.zip" -DestinationPath "rclone-tmp"
          Move-Item "rclone-tmp\rclone-*\rclone.exe" "src-tauri\binaries\rclone-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only create a GitHub release when triggered by a version tag (v*).
          # For manual workflow_dispatch runs (e.g. testing CI), these are left
          # empty so tauri-action just builds without trying to publish anything.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Wild Sync {0}', github.ref_name) || '' }}
          releaseBody: |
            ## Wild Sync ${{ github.ref_name }}

            ---

            ### Mac — Apple Silicon (M1 / M2 / M3 / M4)
            Download **`Wild.Sync_${{ github.ref_name }}_aarch64.dmg`**

            ### Mac — Intel
            Download **`Wild.Sync_${{ github.ref_name }}_x64.dmg`**

            ### Windows
            Download **`Wild.Sync_${{ github.ref_name }}_x64-setup.exe`**

            ---

            ### First time opening on Mac (important)

            Mac will block the app the first time because it wasn't downloaded from the App Store. This is normal — here's how to open it:

            1. Download the `.dmg` and open it
            2. Drag **Wild Sync** into your Applications folder
            3. Go to your Applications folder and try to open Wild Sync
            4. Mac will show a popup saying *"Wild Sync cannot be opened because it is from an unidentified developer"* — click **OK** to dismiss it
            5. Open **System Settings → Privacy & Security**
            6. Scroll down — you'll see *"Wild Sync was blocked"* with an **Open Anyway** button — click it
            7. One more confirmation popup will appear — click **Open**

            Wild Sync will open normally from now on — you only do this once.
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: false
          args: --target ${{ matrix.target }}
